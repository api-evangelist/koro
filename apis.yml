aid: koro
name: KoRo
description: 'KoRo (KoRo Handels GmbH) is a Berlin-based direct-to-consumer food retailer
  that sells nuts, dried fruit, nut butters, snacks, protein products, baking ingredients
  and drugstore goods in bulk packaging at wholesale-style prices, shipping across Europe
  from country storefronts in Germany (korodrogerie.de), Austria, Switzerland, France,
  Italy and the Benelux/EU shop at koro.com. Founded in 2014 and backed by HV Capital
  and Partech, KoRo runs a headless commerce stack — a Shopware 6 backend fronted by a
  Nuxt storefront deployed on Vercel — and publishes its engineering work as open source
  through the KoRoHandelsGmbH GitHub organization, including a Nitro-based Shopware
  Store-API proxy and several Shopware 6 build-tooling packages on npm under the
  @korodrogerie scope. KoRo publishes no public developer portal, no documented partner
  or commerce API, and no API specifications; its Store-API surface is internal and gated
  behind per-sales-channel access keys.'
